[package]
name = "scenix"
description = "Facade crate for the scenix Renderer APIs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
default = ["std", "scene", "camera", "mesh", "material", "light", "texture", "raycaster", "helpers"]
std = ["scenix-math/std", "scenix-core/std", "scenix-input/std", "scenix-scene?/std", "scenix-camera?/std", "scenix-mesh?/std", "scenix-nodes?/std", "scenix-material?/std", "scenix-light?/std", "scenix-texture?/std", "scenix-loader?/std", "scenix-post?/std", "scenix-renderer?/std", "scenix-raycaster?/std", "scenix-helpers?/std", "scenix-animato?/std", "scenix-wasm?/std", "scenix-particles?/std", "scenix-terrain?/std", "scenix-sky?/std", "scenix-water?/std", "scenix-xr?/std", "scenix-audio?/std", "scenix-physics?/std"]
scene = ["dep:scenix-scene"]
camera = ["dep:scenix-camera"]
mesh = ["dep:scenix-mesh"]
material = ["dep:scenix-material"]
particles = ["dep:scenix-particles", "material", "std", "dep:scenix-texture", "scenix-renderer?/particles"]
nodes = ["dep:scenix-nodes", "scenix-renderer?/nodes", "scenix-post?/nodes", "scenix-wasm?/nodes"]
light = ["dep:scenix-light"]
texture = ["dep:scenix-texture"]
loader = ["dep:scenix-loader"]
post = ["dep:scenix-post", "scenix-renderer?/post"]
renderer = ["dep:scenix-renderer"]
terrain = ["dep:scenix-terrain"]
sky = ["dep:scenix-sky"]
water = ["dep:scenix-water"]
environment = ["terrain", "sky", "water", "scenix-renderer?/environment"]
xr = ["dep:scenix-xr"]
audio = ["dep:scenix-audio"]
physics = ["dep:scenix-physics", "scenix-helpers?/physics"]
bridges = ["xr", "audio", "physics"]
raycaster = ["dep:scenix-raycaster"]
helpers = ["dep:scenix-helpers"]
interaction = ["scene", "camera", "raycaster", "helpers"]
editor = [
    "std",
    "interaction",
    "material",
    "light",
    "texture",
    "scenix-core/inspector",
    "scenix-scene/inspector",
    "scenix-camera/inspector",
    "scenix-material/inspector",
    "scenix-light/inspector",
    "scenix-texture/inspector",
    "scenix-animato?/inspector",
    "scenix-renderer?/inspector",
]
egui = ["editor", "scenix-helpers/egui"]
animato = ["dep:scenix-animato"]
wasm = ["dep:scenix-wasm"]
libm = ["scenix-math/libm"]
serde = ["scenix-math/serde", "scenix-core/serde", "scenix-input/serde", "scenix-scene?/serde", "scenix-camera?/serde", "scenix-mesh?/serde", "scenix-material?/serde", "scenix-particles?/serde", "scenix-light?/serde", "scenix-texture?/serde", "scenix-loader?/serde", "scenix-post?/serde", "scenix-renderer?/serde", "scenix-raycaster?/serde", "scenix-helpers?/serde", "scenix-animato?/serde", "scenix-wasm?/serde", "scenix-terrain?/serde", "scenix-sky?/serde", "scenix-water?/serde", "scenix-xr?/serde", "scenix-audio?/serde", "scenix-physics?/serde"]
approx = ["scenix-math/approx"]
gpu = ["scenix-core/gpu"]

[dependencies]
scenix-core = { workspace = true }
scenix-input = { workspace = true }
scenix-math = { workspace = true }
scenix-camera = { workspace = true, optional = true }
scenix-light = { workspace = true, optional = true }
scenix-loader = { workspace = true, optional = true }
scenix-material = { workspace = true, optional = true }
scenix-mesh = { workspace = true, optional = true }
scenix-nodes = { workspace = true, optional = true }
scenix-particles = { workspace = true, optional = true }
scenix-post = { workspace = true, optional = true }
scenix-raycaster = { workspace = true, optional = true }
scenix-renderer = { workspace = true, optional = true }
scenix-scene = { workspace = true, optional = true }
scenix-sky = { workspace = true, optional = true }
scenix-terrain = { workspace = true, optional = true }
scenix-texture = { workspace = true, optional = true }
scenix-water = { workspace = true, optional = true }
scenix-helpers = { workspace = true, optional = true }
scenix-animato = { workspace = true, optional = true }
scenix-wasm = { workspace = true, optional = true }
scenix-xr = { workspace = true, optional = true }
scenix-audio = { workspace = true, optional = true }
scenix-physics = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true }
pollster = { workspace = true }

