[package]
name = "scenix-terrain"
description = "CPU terrain systems for scenix: seeded heightmaps, chunked LOD meshes, splat maps, streaming, and height sampling."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = ["scenix-core/std", "scenix-math/std", "scenix-mesh/std"]
serde = ["dep:serde", "scenix-core/serde", "scenix-math/serde", "scenix-mesh/serde"]

[dependencies]
scenix-core = { workspace = true }
scenix-math = { workspace = true }
scenix-mesh = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[bench]]
name = "terrain_bench"
path = "../../benches/terrain_bench.rs"
harness = false

[[test]]
name = "terrain_chunks"
path = "../../tests/terrain_chunks.rs"
